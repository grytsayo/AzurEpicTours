<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Review management | AzurEpicTours</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; }
        body { margin: 0; background: #f5f1eb; color: #24303a; }
        main { width: min(900px, calc(100% - 32px)); margin: 48px auto; }
        h1 { color: #173f5f; }
        form, .review { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
        label { display: block; font-weight: 700; margin-bottom: 8px; }
        input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #aab4bc; border-radius: 6px; }
        button { border: 0; border-radius: 6px; padding: 11px 18px; cursor: pointer; font-weight: 700; }
        button:focus-visible, input:focus-visible { outline: 3px solid #d4a574; outline-offset: 2px; }
        button:disabled { cursor: wait; opacity: .6; }
        .primary { background: #173f5f; color: white; }
        .reject { background: #7d2626; color: white; }
        .actions { display: flex; gap: 12px; margin-top: 18px; }
        .review { margin: 18px 0; }
        .review header { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
        .stars { color: #b7791f; letter-spacing: 2px; }
        .meta { color: #64707a; font-size: .9rem; }
        #status { min-height: 24px; margin: 16px 0; }
        .error { color: #9b1c1c; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
<main>
    <h1>Review management</h1>
    <p>This private page lists reviews that are currently public.</p>

    <form id="loginForm">
        <label for="adminToken">Admin token</label>
        <input id="adminToken" type="password" autocomplete="current-password" required>
        <div class="actions"><button class="primary" type="submit">Open review manager</button></div>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <section id="pendingSection" hidden>
        <h2>Published reviews</h2>
        <div id="reviews"></div>
    </section>
</main>

<script>
(() => {
    const endpoint = '/.netlify/functions/reviews-admin';
    const loginForm = document.getElementById('loginForm');
    const tokenInput = document.getElementById('adminToken');
    const status = document.getElementById('status');
    const section = document.getElementById('pendingSection');
    const reviewsContainer = document.getElementById('reviews');
    let adminToken = '';

    function setStatus(message, isError = false) {
        status.textContent = message;
        status.className = isError ? 'error' : '';
    }

    function formatDate(value) {
        return new Intl.DateTimeFormat(undefined, {
            dateStyle: 'medium',
            timeStyle: 'short',
            timeZone: 'Europe/Paris'
        }).format(new Date(value));
    }

    async function api(options = {}) {
        const response = await fetch(endpoint, {
            ...options,
            headers: {
                'Authorization': `Bearer ${adminToken}`,
                'Content-Type': 'application/json',
                ...(options.headers || {})
            }
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'Request failed');
        return data;
    }

    function renderReviews(reviews) {
        reviewsContainer.replaceChildren();
        if (!reviews.length) {
            const empty = document.createElement('p');
            empty.textContent = 'No dynamically published reviews.';
            reviewsContainer.appendChild(empty);
            return;
        }

        for (const review of reviews) {
            const article = document.createElement('article');
            article.className = 'review';

            const header = document.createElement('header');
            const author = document.createElement('strong');
            author.textContent = review.name;
            const stars = document.createElement('span');
            stars.className = 'stars';
            stars.textContent = '★'.repeat(review.rating) + '☆'.repeat(5 - review.rating);
            stars.setAttribute('aria-label', `${review.rating} out of 5 stars`);
            header.append(author, stars);

            const text = document.createElement('p');
            text.textContent = review.review;
            const meta = document.createElement('p');
            meta.className = 'meta';
            meta.textContent = `Submitted ${formatDate(review.submittedAt)}`;

            const actions = document.createElement('div');
            actions.className = 'actions';
            const remove = document.createElement('button');
            remove.type = 'button';
            remove.className = 'reject';
            remove.textContent = 'Delete from site';
            remove.addEventListener('click', () => {
                if (window.confirm('Delete this review from the public site permanently?')) removeReview(review.id, article);
            });
            actions.append(remove);
            article.append(header, text, meta, actions);
            reviewsContainer.appendChild(article);
        }
    }

    async function loadReviews() {
        setStatus('Loading…');
        const data = await api();
        renderReviews(data.reviews || []);
        section.hidden = false;
        loginForm.hidden = true;
        setStatus('');
    }

    async function removeReview(id, article) {
        const buttons = article.querySelectorAll('button');
        buttons.forEach(button => { button.disabled = true; });
        setStatus('Deleting review…');
        try {
            await api({ method: 'POST', body: JSON.stringify({ id, action: 'delete' }) });
            article.remove();
            if (!reviewsContainer.querySelector('.review')) renderReviews([]);
            setStatus('Review deleted from the site.');
        } catch (error) {
            buttons.forEach(button => { button.disabled = false; });
            setStatus(error.message, true);
        }
    }

    loginForm.addEventListener('submit', async event => {
        event.preventDefault();
        adminToken = tokenInput.value;
        try {
            await loadReviews();
            tokenInput.value = '';
        } catch (error) {
            adminToken = '';
            setStatus(error.message === 'Unauthorized' ? 'Invalid admin token.' : error.message, true);
        }
    });
})();
</script>
</body>
</html>
